name: SmartStock AI - Data Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "requirements.txt"
      - ".github/workflows/smartstock-pipeline.yml"

permissions:
  contents: read

jobs:
  data-pipeline:
    name: Generate, validate and explore data
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate synthetic sales data
        run: python src/generate_data.py

      - name: Validate and prepare data
        run: python src/prepare_data.py

      - name: Run exploratory analysis
        run: python src/explore_data.py

      - name: Upload pipeline outputs
        uses: actions/upload-artifact@v4
        with:
          name: smartstock-stage-2-results
          path: |
            data/raw/synthetic_sales.csv
            data/processed/cleaned_sales.csv
            reports/data_quality_report.json
            reports/*.csv
            reports/figures/*.png
          if-no-files-found: error
          retention-days: 14
